networks:
  mailcowdockerized_mailcow-network:
    external: true
  devnodo_net:
    external: true

services:
  app:
    build:
      context: .
      extra_hosts:
        - "github.com:140.82.114.4"
        - "codeload.github.com:140.82.114.4"
    container_name: devnodo-marketing-backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./storage:/var/www/html/storage
      # Host Vite build (image rebuilds often omit public/build)
      - ./public/build:/var/www/html/public/build:ro
    networks:
      - mailcowdockerized_mailcow-network
      - devnodo_net
    extra_hosts:
      - "github.com:140.82.114.4"
      - "codeload.github.com:140.82.114.4"
    environment:
      # Unique container DNS — shared nets also have other services named postgres/redis
      DB_HOST: devnodo-marketing-postgres
      REDIS_HOST: devnodo-marketing-redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=devnodo_net"
      - "traefik.http.routers.devnodo-marketing.rule=Host(`marketing.devnodo.com`)"
      - "traefik.http.routers.devnodo-marketing.entrypoints=websecure"
      - "traefik.http.routers.devnodo-marketing.tls=true"
      - "traefik.http.routers.devnodo-marketing.tls.certresolver=letsencrypt"
      - "traefik.http.routers.devnodo-marketing.service=devnodo-marketing"
      - "traefik.http.routers.devnodo-marketing-http.rule=Host(`marketing.devnodo.com`)"
      - "traefik.http.routers.devnodo-marketing-http.entrypoints=web"
      - "traefik.http.routers.devnodo-marketing-http.middlewares=redirect-to-https"
      - "traefik.http.services.devnodo-marketing.loadbalancer.server.port=80"

  worker:
    build:
      context: .
      extra_hosts:
        - "github.com:140.82.114.4"
        - "codeload.github.com:140.82.114.4"
    container_name: devnodo-marketing-worker
    restart: unless-stopped
    env_file: .env
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./storage:/var/www/html/storage
    networks:
      - mailcowdockerized_mailcow-network
      - devnodo_net
    extra_hosts:
      - "github.com:140.82.114.4"
      - "codeload.github.com:140.82.114.4"
    environment:
      DB_HOST: devnodo-marketing-postgres
      REDIS_HOST: devnodo-marketing-redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: devnodo-marketing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - marketing_postgres_data:/var/lib/postgresql/data
    networks:
      # Keep off mailcow-network: hostname "postgres"/"redis" collide with Mailcow DNS
      - devnodo_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devnodo-marketing-redis
    restart: unless-stopped
    volumes:
      - marketing_redis_data:/data
    networks:
      # Keep off mailcow-network: "redis" stole Mailcow PHP sessions (admin login loop)
      - devnodo_net

volumes:
  marketing_redis_data:
  marketing_postgres_data:
